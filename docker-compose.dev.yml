version: "3.9"

services:
  backend:
    build:
      context: .
      target: dev
    container_name: tfg-entrenamientoapp-backend-dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_EXTERNAL_PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/entrenamiento_db}
      - CI=true
    command: sh -c "pnpm install && pnpm run seed && nodemon src/index.js"
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
