name: Node.js CI

on:
  push:
    branches: [ "main", "feature/*", "setup/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: npm run lint
    - name: Run tests
      run: npm test -- --passWithNoTests
      env:
        NODE_ENV: test
        MONGO_URI_TEST: mongodb://localhost:27017/entrenamiento_test
