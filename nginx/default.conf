# Necesario para pasar correctamente las conexiones WebSocket del chat
# (Socket.IO, src/config/socket.js) a través del proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    # Nginx necesita el certificado hoja + intermedios (sin la raíz).
    # Si el cliente/app da error de verificación, prueba con Cert_bundle_root.pem.
    ssl_certificate     /etc/nginx/certs/Cert_bundle.pem;
    # Clave sin passphrase: la original (privateKey.pem) hace que nginx pida
    # la contraseña en cada arranque y falle en Docker.
    ssl_certificate_key /etc/nginx/certs/privateKey_sin_clave.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket (chat en tiempo real vía Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
